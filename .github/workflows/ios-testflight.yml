name: iOS TestFlight

# Se lanza a mano desde la pestaña "Actions" de GitHub, o automáticamente al
# empujar a main. Compila y firma la app en un runner macOS (gratuito en
# GitHub Actions) y la sube a TestFlight. No requiere Mac ni Visual Studio.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # .NET para iOS exige una versión EXACTA de Xcode (ni más nueva ni más
      # vieja vale), y el runner trae varias instaladas en paralelo. Buscamos
      # la 26.5 concreta; si no está, usamos la más cercana como último recurso.
      - name: Select Xcode 26.5
        run: |
          echo "Xcode instalados:"
          ls -d /Applications/Xcode_*.app 2>/dev/null
          TARGET_XCODE=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | head -1)
          if [ -z "$TARGET_XCODE" ]; then
            echo "No se encontró Xcode 26.5 exacto, usando el más reciente disponible."
            TARGET_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Usando $TARGET_XCODE"
          sudo xcode-select -s "$TARGET_XCODE"
          xcodebuild -version

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Se instalan todos los workloads de MAUI (no solo iOS): el proyecto está
      # multi-target (net9.0-android;net9.0-ios) y el restore de un publish con
      # -f net9.0-ios sigue evaluando el resto de TargetFrameworks del csproj.
      - name: Install MAUI workloads
        run: dotnet workload install maui

      # --- Certificado de distribución -----------------------------------
      # Secreto IOS_DIST_CERTIFICATE_BASE64: el .p12 exportado desde Keychain
      # Access (o generado con openssl), codificado en base64.
      # Secreto IOS_DIST_CERTIFICATE_PASSWORD: la contraseña con la que se
      # exportó ese .p12.
      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      # --- Perfil de aprovisionamiento ------------------------------------
      # Secreto IOS_PROVISIONING_PROFILE_BASE64: el .mobileprovision (tipo
      # App Store) descargado de Apple Developer, codificado en base64.
      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/profile.mobileprovision"

      # --- Compilación y firma ---------------------------------------------
      # Secreto IOS_CODESIGN_KEY: nombre exacto del certificado, tal como
      # aparece en Keychain Access, ej. "Apple Distribution: Tu Nombre (EQUIPOID)".
      # Secreto IOS_CODESIGN_PROVISION: el nombre que le pusiste al perfil de
      # aprovisionamiento en Apple Developer (no el UUID del archivo).
      - name: Publish iOS app
        env:
          CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          CODESIGN_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
        run: >
          dotnet publish IronReign.csproj
          -f net9.0-ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:BuildIpa=true
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$CODESIGN_PROVISION"

      # --- Subida a TestFlight ---------------------------------------------
      # Secreto ASC_API_KEY_ID / ASC_API_ISSUER_ID: de App Store Connect ->
      # Usuarios y Accesos -> Claves -> Claves de App Store Connect.
      # Secreto ASC_API_KEY_BASE64: el archivo AuthKey_XXXX.p8 descargado al
      # crear esa clave, codificado en base64 (solo se puede descargar una vez).
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_$API_KEY_ID.p8
          IPA_PATH=$(find bin -name "*.ipa" | head -n 1)
          echo "Subiendo $IPA_PATH"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
